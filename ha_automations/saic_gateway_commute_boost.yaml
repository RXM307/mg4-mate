# saic_gateway_set_inactive_period.yaml
#
# PROBLEM SOLVED
# The SAIC MQTT Gateway defaults to gateway_inactive_refresh_period = 86400s
# (24 hours). While the car is parked, the gateway queries SAIC once a day:
# if the car sets off before the next cycle, MG4 Mate never sees
# vehicle_running = on and the trip is not recorded.
#
# SOLUTION
# Lower the period to 3600s (1h, the gateway minimum) once.
# Polling goes to the SAIC cloud API (it does not physically wake the car).
#
# HOW TO APPLY (one-off, from HA Developer Tools → Services):
#
#   service: number.set_value
#   target:
#     entity_id: number.lsjwh4097rn111393_gateway_inactive_refresh_period
#   data:
#     value: 3600
#
# Or use the full script below to get an entry in the HA logbook.

alias: "MG4 - Set gateway inactive refresh to 3600s"
description: >
  Lowers gateway_inactive_refresh_period to 3600s (gateway minimum, default: 86400s).
  Run once — the value persists in the SAIC gateway.
mode: single

trigger: []   # no trigger: run manually from Developer Tools

action:
  - service: number.set_value
    target:
      entity_id: number.lsjwh4097rn111393_gateway_inactive_refresh_period
    data:
      value: 3600
  - service: logbook.log
    data:
      name: "MG4 Gateway"
      message: "gateway_inactive_refresh_period impostato a 3600s (era 86400s)"
